name: Build Debug APK

on:
  push:
    branches: [main, vibe/nav-drawer-services-9e96d4]
  pull_request:
    branches: [main, vibe/nav-drawer-services-9e96d4]
  workflow_dispatch:

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure MainActivity logcat-bg + SendText
        run: |
          set -e
          git show 89937f5a793b933642818532e1ac2a8bcc4679f7:app/src/main/java/com/cwbridge/android/MainActivity.kt > app/src/main/java/com/cwbridge/android/MainActivity.kt
          python3 << 'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/cwbridge/android/MainActivity.kt")
          t = p.read_text()
          t = t.replace(
          """    override fun onPause() {
        logcatReader.stop()
        super.onPause()
    }""",
          """    override fun onPause() {
        if (!bridgeRunning) logcatReader.stop()
        super.onPause()
    }""",
          1)
          t = t.replace(
          """            bridgeRunning = true
            CatWebTracker.reset()
            AntiDisconnect.start(lifecycleScope)
            invokeEngine.start()""",
          """            bridgeRunning = true
            CatWebTracker.reset()
            logcatReader.start(lifecycleScope)
            AntiDisconnect.start(lifecycleScope)
            invokeEngine.start()""",
          1)
          t = t.replace(
          """            bridgeRunning = false
            invokeEngine.stop()
            executionEngine.stop()
            AntiDisconnect.stop()
            LogBuffer.i("CWBridge", "bridge stopped")""",
          """            bridgeRunning = false
            invokeEngine.stop()
            executionEngine.stop()
            AntiDisconnect.stop()
            logcatReader.stop()
            LogBuffer.i("CWBridge", "bridge stopped")""",
          1)
          t = t.replace("version=2.9.4-android ctrl-t-test", "version=2.9.5-android logcat-bg", 1)
          p.write_text(t)
          assert "if (!bridgeRunning) logcatReader.stop()" in t
          assert "Send Text" in t
          print("MainActivity ready", len(t))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Decode fixed debug keystore
        run: |
          mkdir -p keystore
          base64 -d keystore/cwbridge-debug.p12.b64 > keystore/cwbridge-debug.p12
          ls -la keystore/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cwbridge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Summarize
        if: always()
        run: |
          echo "## CWBridge debug APK" >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/debug/ >> "$GITHUB_STEP_SUMMARY" || true
