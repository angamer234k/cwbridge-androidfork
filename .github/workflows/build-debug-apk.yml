name: Build Debug APK

on:
  push:
    branches: [main, vibe/nav-drawer-services-9e96d4]
  pull_request:
    branches: [main, vibe/nav-drawer-services-9e96d4]
  workflow_dispatch:

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Decode fixed debug keystore
        run: |
          mkdir -p keystore
          base64 -d keystore/cwbridge-debug.p12.b64 > keystore/cwbridge-debug.p12
          ls -la keystore/

      - name: Vendor flashbot AdbLib (USB-aware, BSD)
        run: |
          set -e
          DEST=helper/src/main/java/com/cgutman/adblib
          mkdir -p "$DEST"
          BASE=https://raw.githubusercontent.com/wuxudong/flashbot/master/adblib/src/main/java/com/cgutman/adblib
          for f in AdbBase64.java AdbChannel.java AdbConnection.java AdbCrypto.java AdbMessage.java AdbProtocol.java AdbStream.java TcpChannel.java UsbChannel.java package-info.java; do
            curl -fsSL "$BASE/$f" -o "$DEST/$f"
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APKs (app + helper)
        run: gradle :app:assembleDebug :helper:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: cwbridge-debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            helper/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Summarize
        if: always()
        run: |
          echo "## CWBridge debug APKs" >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/outputs/apk/debug/ >> "$GITHUB_STEP_SUMMARY" || true
          ls -lh helper/build/outputs/apk/debug/ >> "$GITHUB_STEP_SUMMARY" || true
