name: quiet-robot
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore LogcatReader then quiet it
        run: |
          set -e
          git show a19f43ed0739b1b1ea4d65b4603e6e042903b589:app/src/main/java/com/cwbridge/android/bridge/LogcatReader.kt > app/src/main/java/com/cwbridge/android/bridge/LogcatReader.kt
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/cwbridge/android/bridge/LogcatReader.kt')
          t = p.read_text()
          old = (
          '                            val lower = line.lowercase()\n'
          '                            val isFlog = lower.contains("flog::creatoroutput") ||\n'
          '                                lower.contains("flog::output") ||\n'
          '                                lower.contains("[from ")\n'
          '                            val isInvoke = line.contains("invoke|")\n'
          '                            val isCat = lower.contains("catweb") || lower.contains("waiting for server")\n'
          '                            if (isFlog || isInvoke || isCat || looksLikeRobloxLine(line)) {\n'
          '                                if (isInvoke) {\n'
          '                                    try {\n'
          '                                        invokeSink?.invoke(line)\n'
          '                                    } catch (t: Throwable) {\n'
          '                                        LogBuffer.e("Logcat", "invokeSink: ${t.message}")\n'
          '                                    }\n'
          '                                }\n'
          '                                LogBuffer.i("Roblox", line.take(300))\n'
          '                            }'
          )
          bullet = '\u2022'
          mid = '\u00B7'
          new = (
          '                            val lower = line.lowercase()\n'
          '                            val isFlog = lower.contains("flog::creatoroutput") ||\n'
          '                                lower.contains("flog::output") ||\n'
          '                                lower.contains("[from ")\n'
          '                            val isInvoke = line.contains("invoke|")\n'
          '                            // CatWeb status only — not every rbx.* / FFlag / FlagCache dump\n'
          '                            val isCat = lower.contains("catweb") ||\n'
          '                                lower.contains("waiting for server") ||\n'
          f'                                ((lower.contains("finished") || lower.contains("loading")) &&\n'
          f'                                    (line.contains(\'{bullet}\') || line.contains(\'{mid}\') || lower.contains("catweb")))\n'
          '                            if (isInvoke) {\n'
          '                                try {\n'
          '                                    invokeSink?.invoke(line)\n'
          '                                } catch (t: Throwable) {\n'
          '                                    LogBuffer.e("Logcat", "invokeSink: ${t.message}")\n'
          '                                }\n'
          '                            }\n'
          '                            // Structured console: CatWeb + creator print only (no raw threadtime spam)\n'
          '                            if (isFlog || isCat) {\n'
          '                                LogBuffer.i("Roblox", line.take(300))\n'
          '                            }'
          )
          if old not in t:
              raise SystemExit('LogcatReader block not found')
          p.write_text(t.replace(old, new, 1))
          p2 = Path('app/src/main/java/com/cwbridge/android/server/LocalHttpServer.kt')
          t2 = p2.read_text()
          needle = '"StrictMode",\n        )'
          insert = (
          '"StrictMode",\n'
          '            "nativeGetFFlag", "nativeRegisterFFlag", "JNIRobloxSettings",\n'
          '            "FlagCache", "DataModelPatch", "StunPopProbe", "ProfileInstaller",\n'
          '            "rbx.glview", "AssetsManifestManager", "TombstoneCache",\n'
          '            "finished ignored",\n'
          '        )'
          )
          if 'FlagCache' not in t2:
              if needle not in t2:
                  raise SystemExit('noise needle missing')
              p2.write_text(t2.replace(needle, insert, 1))
          assert 'if (isFlog || isCat)' in p.read_text()
          print('ok')
          PY
      - name: Commit
        run: |
          git config user.name "cwbridge-bot"
          git config user.email "bot@cwbridge.local"
          git add app/src/main/java/com/cwbridge/android/bridge/LogcatReader.kt \
                  app/src/main/java/com/cwbridge/android/server/LocalHttpServer.kt
          git diff --cached --stat
          git commit -m "fix(console): only CatWeb/creator as ROBOT; drop finished-ignored + engine noise"
          git push
