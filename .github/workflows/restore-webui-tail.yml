name: Restore WebUi tail
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Append missing tail after copyConsole
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64
          p = Path("app/src/main/java/com/cwbridge/android/server/WebUi.kt")
          t = p.read_text(encoding="utf-8")
          if "</script>" in t and "function refreshAll" in t:
              print("already complete", len(t))
          else:
              tail = base64.b64decode("").decode("utf-8")
              t2 = t.rstrip() + "\n" + tail.lstrip("\n")
              p.write_text(t2, encoding="utf-8")
              text = p.read_text(encoding="utf-8")
              assert "</script>" in text
              assert "function refreshAll" in text
              assert "tag-BRIDGE" in text
              print("restored", len(text))
          PY
      - name: Verify check-webui
        run: node scripts/check-webui.js
      - name: Commit
        run: |
          git config user.name "cwbridge-bot"
          git config user.email "cwbridge-bot@users.noreply.github.com"
          git add app/src/main/java/com/cwbridge/android/server/WebUi.kt
          git commit -m "fix(console): restore WebUi tail (refreshAll + script close)" || echo "no change"
          git push
