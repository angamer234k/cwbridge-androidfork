name: Fix SendText inline
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix MainActivity
        run: |
          python3 -c "
          from pathlib import Path
          p = Path('app/src/main/java/com/cwbridge/android/MainActivity.kt')
          t = p.read_text()
          old = '                    8 -> addSendTextAction(service)'
          new = '''                    8 -> {
                        val input = android.widget.EditText(this).apply {
                            hint = \"Text to paste (no Enter)\"
                            setPadding(48, 32, 48, 32)
                            minLines = 2
                        }
                        MaterialAlertDialogBuilder(this)
                            .setTitle(\"Send Text\")
                            .setMessage(\"Pastes into focused field. Does not press Enter.\")
                            .setView(input)
                            .setPositiveButton(\"Add\") { _, _ ->
                                ServiceRepository.addActionToService(
                                    service.id,
                                    Action.SendTextAction(text = input.text?.toString().orEmpty()),
                                )
                                refreshServices()
                            }
                            .setNegativeButton(\"Cancel\", null)
                            .show()
                    }'''
          if old not in t:
              raise SystemExit('old branch not found')
          t = t.replace(old, new, 1)
          p.write_text(t)
          print('fixed', len(t))
          "
      - name: Commit
        run: |
          git config user.name cwbridge-bot
          git config user.email bot@cwbridge.local
          git add app/src/main/java/com/cwbridge/android/MainActivity.kt
          git commit -m "Fix: inline Send Text dialog (compile fix)" || echo nochange
          git push origin main
