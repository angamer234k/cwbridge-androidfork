name: Patch TextMan UI B64
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python3 -c "import base64; open('/tmp/p.py','wb').write(base64.b64decode('{'))"
          python3 /tmp/p.py
      - name: Commit
        run: |
          git config user.name cwbridge-bot
          git config user.email bot@cwbridge.local
          git add app/src/main/java/com/cwbridge/android/
          git commit -m "feat: TextMan EnterText SetVar UI + force-seed defaults (v2.10.6)" || echo nochange
          git push
