name: Hotfix v2.12.0 sources

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hotfix-v2120.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore and patch WebUi
        run: |
          set -euo pipefail
          GOOD=b3196d726ce3fe20f43f5b1bf51c10f83bb76db3
          git show "$GOOD:app/src/main/java/com/cwbridge/android/server/WebUi.kt" > app/src/main/java/com/cwbridge/android/server/WebUi.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/cwbridge/android/server/WebUi.kt')
          t = p.read_text()
          assert t.startswith('package '), t[:40]
          t = t.replace('<div id="app" class="hide">', '<div id="app">', 1)
          old = "async function refreshStatus() {\n  try {\n    const s = await api('/api/status');\n    const p = D('pill');\n    p.className = 'pill ' + (s.state || 'IDLE');\n    p.textContent = s.state || 'IDLE';\n    D('detail').textContent = s.detail || '';\n  } catch (e) {}\n}"
          new = "function revealApp() {\n  NEEDS_LOGIN = false;\n  D('login').classList.add('hide');\n  D('app').classList.remove('hide');\n}\n\nasync function refreshStatus() {\n  try {\n    const s = await api('/api/status');\n    revealApp();\n    const p = D('pill');\n    p.className = 'pill ' + (s.state || 'IDLE');\n    p.textContent = s.state || 'IDLE';\n    D('detail').textContent = s.detail || '';\n    var bits = [];\n    bits.push(s.accessibility ? 'a11y ok' : 'a11y OFF');\n    bits.push(s.shizuku ? 'shizuku ok' : 'shizuku OFF');\n    bits.push(s.catwebReady ? 'catweb ready' : 'catweb waiting');\n    if (!D('detail').textContent) D('detail').textContent = bits.join(' · ');\n    else D('detail').textContent = D('detail').textContent + ' · ' + bits.join(' · ');\n  } catch (e) {}\n}"
          if old not in t:
              raise SystemExit('refreshStatus block missing')
          t = t.replace(old, new, 1)
          old_login = "    NEEDS_LOGIN = false;\n    D('login').classList.add('hide');\n    D('app').classList.remove('hide');\n    msg('loginMsg', '');"
          new_login = "    revealApp();\n    msg('loginMsg', '');"
          if old_login not in t:
              raise SystemExit('doLogin block missing')
          t = t.replace(old_login, new_login, 1)
          p.write_text(t)
          print('WebUi patched', len(t))
          PY

      - name: Commit
        run: |
          git config user.name cwbridge-bot
          git config user.email bot@cwbridge.local
          git add app/src/main/java/com/cwbridge/android/server/WebUi.kt
          if git diff --cached --quiet; then
            echo no changes
          else
            git commit -m "fix: WebUi blank page (reveal #app on LAN)"
            git push
          fi
