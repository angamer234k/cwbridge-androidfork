name: Hotfix features

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hotfix-v2120.yml'
      - 'scripts/hotfix_features.py'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Run hotfix script
        run: python3 scripts/hotfix_features.py

      - name: Commit and push
        run: |
          git config user.name cwbridge-bot
          git config user.email bot@cwbridge.local
          git add -A
          if git diff --cached --quiet; then
            echo no changes
          else
            git commit -m "feat: port fallback 8080-8765-80, Shizuku keys, CatWeb auto-open"
            git push
          fi
