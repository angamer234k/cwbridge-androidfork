name: Console color tags
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch WebUi console colors + newlines
        run: |
          echo '' | base64 -d > /tmp/patch_console.py
          python3 /tmp/patch_console.py
      - name: Commit
        run: |
          git config user.name "cwbridge-bot"
          git config user.email "cwbridge-bot@users.noreply.github.com"
          git add app/src/main/java/com/cwbridge/android/server/WebUi.kt
          git diff --cached --stat
          git commit -m "feat(console): color tags and one entry per line" || echo "no change"
          git push
