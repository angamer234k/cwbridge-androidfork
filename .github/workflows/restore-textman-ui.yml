name: Restore emptied files + TextMan UI
on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - name: Restore from last good commit and patch
        run: |
          set -e
          GOOD=83cc37a965b157329daef4a1655195a80b15ea8c
          git show "$GOOD:app/src/main/java/com/cwbridge/android/MainActivity.kt" > app/src/main/java/com/cwbridge/android/MainActivity.kt
          git show "$GOOD:app/src/main/java/com/cwbridge/android/ServiceModels.kt" > app/src/main/java/com/cwbridge/android/ServiceModels.kt
          wc -l app/src/main/java/com/cwbridge/android/MainActivity.kt app/src/main/java/com/cwbridge/android/ServiceModels.kt
          python3 << 'PY'
          from pathlib import Path
          import re

          sm_path = Path("app/src/main/java/com/cwbridge/android/ServiceModels.kt")
          sm = sm_path.read_text()
          if "seedOrReplaceDefault" not in sm:
              sm = sm.replace("upsertDefault(", "seedOrReplaceDefault(")
              pattern = r"    private fun (?:upsertDefault|seedOrReplaceDefault)\(template: Service\) \{.*?\n    \}\n\}"
              replacement = """    private fun seedOrReplaceDefault(template: Service) {
        val idx = inMemoryServices.indexOfFirst { it.id == template.id }
        if (idx >= 0) {
            inMemoryServices[idx] = template
        } else {
            inMemoryServices.add(template)
        }
        saveToDatabase(template)
        LogBuffer.i(
            \"Services\",
            \"default ${template.name}: ${template.triggers.size} triggers, ${template.actions.size} actions\",
        )
    }

    fun forceRepairDefaults() {
        listOf(\"default-save-keys\", \"default-load-keys\").forEach { id ->
            inMemoryServices.removeAll { it.id == id }
            deleteFromDatabase(id)
        }
        ensureDefaultServices()
        LogBuffer.i(\"Services\", \"force-repaired default Save/Load keys\")
    }
}
"""
              m = re.search(pattern, sm, flags=re.S)
              if not m:
                  raise SystemExit("could not find upsertDefault/seed function")
              sm = sm[:m.start()] + replacement
              sm_path.write_text(sm)
              print("ServiceModels force-seed patched")
          else:
              print("ServiceModels already seeded")

          ma_path = Path("app/src/main/java/com/cwbridge/android/MainActivity.kt")
          ma = ma_path.read_text()
          if "addTextManAction" in ma:
              print("MainActivity already has TextMan")
          else:
              old = '''.setItems(arrayOf("Tap", "Get Info", "HTTP Request", "AI Action", "Delay", "Run Service")) { _, which ->
                when (which) {
                    0 -> addTapAction(service)
                    1 -> addGetInfoAction(service)
                    2 -> addHttpRequestAction(service)
                    3 -> addAiAction(service)
                    4 -> addDelayAction(service)
                    5 -> addRunServiceAction(service)
                }
            }'''
              new = '''.setItems(
                arrayOf(
                    "Tap",
                    "Get Info",
                    "HTTP Request",
                    "AI Action",
                    "Delay",
                    "Run Service",
                    "Ctrl+T",
                    "Press Enter",
                    "Send Text (no Enter)",
                    "Enter Text (type + Enter)",
                    "TextMan (extract → var)",
                    "Set variable",
                ),
            ) { _, which ->
                when (which) {
                    0 -> addTapAction(service)
                    1 -> addGetInfoAction(service)
                    2 -> addHttpRequestAction(service)
                    3 -> addAiAction(service)
                    4 -> addDelayAction(service)
                    5 -> addRunServiceAction(service)
                    6 -> {
                        ServiceRepository.addActionToService(service.id, Action.CtrlTAction())
                        refreshServices()
                    }
                    7 -> {
                        ServiceRepository.addActionToService(service.id, Action.PressEnterAction())
                        refreshServices()
                    }
                    8 -> addSendTextAction(service)
                    9 -> addEnterTextAction(service)
                    10 -> addTextManAction(service)
                    11 -> addSetVarAction(service)
                }
            }'''
              if old not in ma:
                  raise SystemExit("add action items not found")
              ma = ma.replace(old, new, 1)
              helpers = r'''
    private fun addSendTextAction(service: Service) {
        val input = android.widget.EditText(this).apply {
            hint = "Text (supports \$var / \${var})"
            minLines = 2
        }
        MaterialAlertDialogBuilder(this)
            .setTitle("Send Text")
            .setView(input)
            .setPositiveButton("Add") { _, _ ->
                ServiceRepository.addActionToService(
                    service.id,
                    Action.SendTextAction(text = input.text?.toString().orEmpty()),
                )
                refreshServices()
            }
            .setNegativeButton("Cancel", null)
            .show()
    }

    private fun addEnterTextAction(service: Service) {
        val input = android.widget.EditText(this).apply {
            hint = "Type this, then Enter (\$var ok)"
            minLines = 2
        }
        MaterialAlertDialogBuilder(this)
            .setTitle("Enter Text")
            .setView(input)
            .setPositiveButton("Add") { _, _ ->
                ServiceRepository.addActionToService(
                    service.id,
                    Action.EnterTextAction(text = input.text?.toString().orEmpty()),
                )
                refreshServices()
            }
            .setNegativeButton("Cancel", null)
            .show()
    }

    private fun addTextManAction(service: Service) {
        val pad = (16 * resources.displayMetrics.density).toInt()
        val layout = android.widget.LinearLayout(this).apply {
            orientation = android.widget.LinearLayout.VERTICAL
            setPadding(pad, pad, pad, pad)
        }
        fun field(hint: String, single: Boolean = true) = android.widget.EditText(this).also {
            it.hint = hint
            it.setSingleLine(single)
            layout.addView(it)
        }
        val source = field("Source (\$lastMatch or \$var or text)")
        source.setText("\$lastMatch")
        val mode = field("Mode: full | regex | after | before | replace | trim")
        mode.setText("regex")
        val pattern = field("Pattern / regex")
        val group = field("Regex group (default 1)")
        group.setText("1")
        val replaceWith = field("Replace with (replace mode)")
        val saveTo = field("Save to variable name")
        saveTo.setText("result")
        MaterialAlertDialogBuilder(this)
            .setTitle("TextMan")
            .setView(layout)
            .setPositiveButton("Add") { _, _ ->
                ServiceRepository.addActionToService(
                    service.id,
                    Action.TextManAction(
                        source = source.text?.toString().orEmpty().ifBlank { "\$lastMatch" },
                        mode = mode.text?.toString().orEmpty().ifBlank { "regex" },
                        pattern = pattern.text?.toString().orEmpty(),
                        group = group.text?.toString()?.toIntOrNull() ?: 1,
                        replaceWith = replaceWith.text?.toString().orEmpty(),
                        saveTo = saveTo.text?.toString().orEmpty().ifBlank { "result" },
                    ),
                )
                refreshServices()
            }
            .setNegativeButton("Cancel", null)
            .show()
    }

    private fun addSetVarAction(service: Service) {
        val pad = (16 * resources.displayMetrics.density).toInt()
        val layout = android.widget.LinearLayout(this).apply {
            orientation = android.widget.LinearLayout.VERTICAL
            setPadding(pad, pad, pad, pad)
        }
        val key = android.widget.EditText(this).apply { hint = "Variable name" }
        val value = android.widget.EditText(this).apply {
            hint = "Value (can use \$other)"
            minLines = 2
        }
        layout.addView(key)
        layout.addView(value)
        MaterialAlertDialogBuilder(this)
            .setTitle("Set variable")
            .setView(layout)
            .setPositiveButton("Add") { _, _ ->
                ServiceRepository.addActionToService(
                    service.id,
                    Action.SetVarAction(
                        key = key.text?.toString().orEmpty(),
                        value = value.text?.toString().orEmpty(),
                    ),
                )
                refreshServices()
            }
            .setNegativeButton("Cancel", null)
            .show()
    }

'''
              marker = "    private fun addTapAction(service: Service) {"
              if marker not in ma:
                  raise SystemExit("addTapAction not found")
              ma = ma.replace(marker, helpers + marker, 1)
              ma = ma.replace(
                  "session start version=2.9.4-android ctrl-t-test",
                  "session start version=2.10.6-android textman-vars",
                  1,
              )
              ma_path.write_text(ma)
              print("MainActivity TextMan UI patched", len(ma))
          PY
      - name: Commit and push
        run: |
          git config user.name "cwbridge-bot"
          git config user.email "bot@cwbridge.local"
          git add app/src/main/java/com/cwbridge/android/MainActivity.kt app/src/main/java/com/cwbridge/android/ServiceModels.kt
          git status
          git commit -m "fix: restore MainActivity+ServiceModels + TextMan/vars UI (v2.10.6)" || echo nochange
          git push
