name: Release APKs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.8.1)"
        required: true
        default: "v2.8.1"
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Decode fixed debug keystore
        run: |
          mkdir -p keystore
          base64 -d keystore/cwbridge-debug.p12.b64 > keystore/cwbridge-debug.p12
          ls -la keystore/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APKs
        run: gradle :app:assembleDebug :helper:assembleDebug --no-daemon --stacktrace

      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p dist
          APP=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          HELPER=$(ls helper/build/outputs/apk/debug/*.apk | head -1)
          cp "$APP" dist/cwbridge-android-debug.apk
          cp "$HELPER" dist/cwbridge-helper-debug.apk
          ls -lh dist/
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cwbridge-release-apks
          path: dist/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.collect.outputs.tag }}
          name: CWBridge ${{ steps.collect.outputs.tag }}
          body: |
            ## CWBridge Android + Helper

            | APK | Purpose |
            |-----|---------|
            | `cwbridge-android-debug.apk` | Main app (taps + invoke engine) |
            | `cwbridge-helper-debug.apk` | Phone OTG helper → push update to tablet |

            ### Helper usage
            1. Install helper on **phone**
            2. Tablet: enable **USB debugging**
            3. Connect phone (host) ↔ OTG ↔ tablet
            4. Allow USB debugging prompt on tablet
            5. Open helper → **Push update**

            Signed with the fixed debug keystore (updates without uninstall after first install of that key).
          files: |
            dist/cwbridge-android-debug.apk
            dist/cwbridge-helper-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
