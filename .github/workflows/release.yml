name: Release APKs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.16.0)"
        required: true
        default: "v2.16.0"
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check web panel (WebUi.kt)
        run: node scripts/check-webui.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Decode fixed debug keystore
        run: |
          mkdir -p keystore
          base64 -d keystore/cwbridge-debug.p12.b64 > keystore/cwbridge-debug.p12

      - name: Vendor flashbot AdbLib (USB-aware, BSD)
        run: |
          set -e
          DEST=helper/src/main/java/com/cgutman/adblib
          mkdir -p "$DEST"
          BASE=https://raw.githubusercontent.com/wuxudong/flashbot/master/adblib/src/main/java/com/cgutman/adblib
          for f in AdbBase64.java AdbChannel.java AdbConnection.java AdbCrypto.java AdbMessage.java AdbProtocol.java AdbStream.java TcpChannel.java UsbChannel.java package-info.java; do
            curl -fsSL "$BASE/$f" -o "$DEST/$f"
          done
          ls -la "$DEST"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APKs
        run: gradle :app:assembleDebug :helper:assembleDebug --no-daemon --stacktrace

      - name: Collect artifacts + notes
        id: collect
        run: |
          mkdir -p dist
          APP=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          HELPER=$(ls helper/build/outputs/apk/debug/*.apk | head -1)
          cp "$APP" dist/cwbridge-android-debug.apk
          cp "$HELPER" dist/cwbridge-helper-debug.apk
          ls -lh dist/

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          APP_VER=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          HELPER_VER=$(grep -E 'versionName\s*=' helper/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "app_ver=${APP_VER}" >> "$GITHUB_OUTPUT"
          echo "helper_ver=${HELPER_VER}" >> "$GITHUB_OUTPUT"

          cat > dist/RELEASE_BODY.md << EOF
          ## CWBridge ${TAG}

          Built from \`main\` at this tag.

          | APK | versionName |
          |-----|-------------|
          | \`cwbridge-android-debug.apk\` | ${APP_VER} |
          | \`cwbridge-helper-debug.apk\` | ${HELPER_VER} |

          Auto-generated commit notes are attached below. Edit this release on GitHub if you want a longer changelog.
          EOF
          # strip the leading spaces from the heredoc indent
          sed -i 's/^          //' dist/RELEASE_BODY.md
          cat dist/RELEASE_BODY.md

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cwbridge-release-apks
          path: dist/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.collect.outputs.tag }}
          name: CWBridge ${{ steps.collect.outputs.tag }}
          body_path: dist/RELEASE_BODY.md
          files: |
            dist/cwbridge-android-debug.apk
            dist/cwbridge-helper-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
