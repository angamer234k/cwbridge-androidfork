name: Ship Live Stream
on:
  workflow_dispatch:
jobs:
  ship:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch BridgeControl JPEG helper
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/cwbridge/android/bridge/BridgeControl.kt")
          t = p.read_text()
          if "fun pngToJpeg" in t:
              print("BridgeControl already has pngToJpeg")
          else:
              # add import if missing
              if "android.graphics.BitmapFactory" not in t:
                  t = t.replace(
                      "import android.graphics.Bitmap\n",
                      "import android.graphics.Bitmap\nimport android.graphics.BitmapFactory\n",
                  )
              needle = """    private fun encodePng(bitmap: Bitmap): Result<ByteArray> = try {
        val out = ByteArrayOutputStream()
        bitmap.compress(Bitmap.CompressFormat.PNG, 100, out)
        Result.success(out.toByteArray())
    } catch (t: Throwable) {
        Result.failure(IllegalStateException("png encode failed: ${t.message}"))
    }"""
              insert = needle + """

    /** Re-encode PNG bytes as JPEG for faster live-stream frames. */
    fun pngToJpeg(png: ByteArray, quality: Int = 55): ByteArray? {
        return try {
            val bmp = BitmapFactory.decodeByteArray(png, 0, png.size) ?: return null
            val out = ByteArrayOutputStream()
            val q = quality.coerceIn(20, 95)
            if (!bmp.compress(Bitmap.CompressFormat.JPEG, q, out)) return null
            out.toByteArray()
        } catch (_: Throwable) {
            null
        }
    }"""
              if needle not in t:
                  raise SystemExit("encodePng block not found")
              t = t.replace(needle, insert)
              p.write_text(t)
              print("BridgeControl patched", p.stat().st_size)
          PY
      - name: Patch LocalHttpServer screenshot query fmt=jpeg
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/cwbridge/android/server/LocalHttpServer.kt")
          t = p.read_text()
          old = '''            path == "/api/screenshot" -> {
                val shot = BridgeControl.takeScreenshot(context)
                shot.fold(
                    onSuccess = { bytes ->
                        respondBytes(out, 200, bytes, "image/png")
                    },
                    onFailure = {
                        val code = if (it is UnsupportedOperationException) 501 else 503
                        respond(out, code, json(mapOf("error" to (it.message ?: "failed"))))
                    },
                )
            }'''
          new = '''            path == "/api/screenshot" -> {
                val shot = BridgeControl.takeScreenshot(context)
                val wantJpeg = query["fmt"].equals("jpeg", ignoreCase = true) ||
                    query["format"].equals("jpeg", ignoreCase = true)
                val quality = query["q"]?.toIntOrNull()?.coerceIn(20, 95) ?: 55
                shot.fold(
                    onSuccess = { bytes ->
                        if (wantJpeg) {
                            val jpg = BridgeControl.pngToJpeg(bytes, quality)
                            if (jpg != null) respondBytes(out, 200, jpg, "image/jpeg")
                            else respondBytes(out, 200, bytes, "image/png")
                        } else {
                            respondBytes(out, 200, bytes, "image/png")
                        }
                    },
                    onFailure = {
                        val code = if (it is UnsupportedOperationException) 501 else 503
                        respond(out, code, json(mapOf("error" to (it.message ?: "failed"))))
                    },
                )
            }'''
          if old not in t:
              if "wantJpeg" in t:
                  print("LocalHttpServer already jpeg-aware")
              else:
                  raise SystemExit("screenshot block not found")
          else:
              t = t.replace(old, new)
              p.write_text(t)
              print("LocalHttpServer patched", p.stat().st_size)
          PY
      - name: Patch WebUi stream button + JS
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/cwbridge/android/server/WebUi.kt")
          t = p.read_text()

          # 1) button onclick
          old_btn = '''<button type="button" id="btnStream" onclick="msg('ctlMsg','stream coming next build','')"><span class="ms sm">live_tv</span> Start stream</button>'''
          new_btn = '''<button type="button" id="btnStream" onclick="toggleStream()"><span class="ms sm">live_tv</span> Start stream</button>'''
          if old_btn in t:
              t = t.replace(old_btn, new_btn)
              print("button updated")
          elif 'onclick="toggleStream()"' in t:
              print("button already wired")
          else:
              raise SystemExit("btnStream not found")

          # 2) CSS for stream cursor (in PART_A style block if needed)
          if "#streamImg" not in t:
              t = t.replace(
                  ".stream-on #btnStream{background:var(--good)}",
                  ".stream-on #btnStream{background:var(--good)}\n#streamImg,#shotImg{cursor:crosshair;width:100%;max-width:100%;display:block;touch-action:none;user-select:none}\n#shotBox{margin-top:10px}",
              )

          # 3) JS functions — inject before loadShot
          if "function toggleStream" not in t:
              js = r'''
var streamOn = false;
var streamTimer = null;

function toggleStream(){
  if(streamOn) stopStream();
  else startStream();
}
function startStream(){
  streamOn = true;
  try{ document.body.classList.add("stream-on"); }catch(e){}
  var btn = D("btnStream");
  if(btn) btn.innerHTML = "<span class=\"ms sm\">stop_circle</span> Stop stream";
  msg("ctlMsg", "streaming…", "good");
  pollStream();
}
function stopStream(){
  streamOn = false;
  try{ document.body.classList.remove("stream-on"); }catch(e){}
  if(streamTimer){ clearTimeout(streamTimer); streamTimer = null; }
  var btn = D("btnStream");
  if(btn) btn.innerHTML = "<span class=\"ms sm\">live_tv</span> Start stream";
  msg("ctlMsg", "stream stopped", "");
}
async function pollStream(){
  if(!streamOn) return;
  try{
    var res = await fetch("/api/screenshot?fmt=jpeg&q=50", {credentials:"same-origin", cache:"no-store"});
    if(res.status === 401){ location.reload(); return; }
    if(res.ok){
      var blob = await res.blob();
      if(blob && blob.size > 100){
        var url = URL.createObjectURL(blob);
        var box = D("shotBox");
        var img = D("streamImg");
        if(!img && box){
          box.innerHTML = "<img id=\"streamImg\" alt=\"live\">";
          img = D("streamImg");
          if(img) bindStreamTap(img);
        }
        if(img){
          var old = img.src;
          img.src = url;
          if(old && old.indexOf("blob:") === 0){ try{ URL.revokeObjectURL(old); }catch(e){} }
        }
      }
    }
  }catch(e){}
  if(streamOn) streamTimer = setTimeout(pollStream, 400);
}
function bindStreamTap(img){
  var downAt = 0, downX = 0, downY = 0;
  function pct(ev){
    var r = img.getBoundingClientRect();
    var src = (ev.changedTouches && ev.changedTouches[0]) || ev;
    var cx = src.clientX, cy = src.clientY;
    var x = ((cx - r.left) / Math.max(1, r.width)) * 100;
    var y = ((cy - r.top) / Math.max(1, r.height)) * 100;
    return {x: Math.max(0, Math.min(100, x)), y: Math.max(0, Math.min(100, y))};
  }
  function onDown(ev){
    try{ ev.preventDefault(); }catch(e){}
    downAt = Date.now();
    var p = pct(ev);
    downX = p.x; downY = p.y;
  }
  function onUp(ev){
    try{ ev.preventDefault(); }catch(e){}
    if(!downAt) return;
    var held = Date.now() - downAt;
    downAt = 0;
    var body = {mode:"percent", x: downX, y: downY};
    if(held >= 450) body.holdMs = Math.min(held, 2000);
    post("/api/tap", body).then(function(j){
      if(j && j.error) msg("ctlMsg", j.error, "err");
      else msg("ctlMsg", (body.holdMs ? "long-press " : "tap ") + downX.toFixed(1) + "% " + downY.toFixed(1) + "%", "good");
    }).catch(function(e){ msg("ctlMsg", e.message || String(e), "err"); });
  }
  img.addEventListener("pointerdown", onDown);
  img.addEventListener("pointerup", onUp);
  img.addEventListener("pointercancel", function(){ downAt = 0; });
}

'''
              marker = "async function loadShot(){"
              if marker not in t:
                  raise SystemExit("loadShot not found")
              t = t.replace(marker, js + marker)
              print("JS injected")
          else:
              print("toggleStream already present")

          # Also bind tap on single screenshot images after loadShot sets them
          old_shot_html = """    D('shotBox').innerHTML =
      '<img id="shotImg" alt="screenshot" src="' + url + '">' +
      '<div class="row" style="margin-top:8px">' +
      '<a class="btn ghost" download="cwbridge-' + ts + '.png" href="' + url + '">' +
      '<span class="ms sm">download</span> Download</a></div>';"""
          new_shot_html = """    D('shotBox').innerHTML =
      '<img id="shotImg" alt="screenshot" src="' + url + '">' +
      '<div class="row" style="margin-top:8px">' +
      '<a class="btn ghost" download="cwbridge-' + ts + '.png" href="' + url + '">' +
      '<span class="ms sm">download</span> Download</a></div>';
    var si = D('shotImg');
    if(si) bindStreamTap(si);"""
          if old_shot_html in t:
              t = t.replace(old_shot_html, new_shot_html)
              print("loadShot tap bind added")
          elif "if(si) bindStreamTap(si)" in t:
              print("loadShot already binds")
          else:
              print("WARN: loadShot html block not exact — skip bind")

          p.write_text(t)
          print("WebUi size", p.stat().st_size)
          PY
      - name: Bump version
        run: |
          sed -i 's/versionCode = 14/versionCode = 15/' app/build.gradle.kts || true
          sed -i 's/versionName = "2.14.0-android"/versionName = "2.15.0-android"/' app/build.gradle.kts || true
          grep -n 'versionCode\|versionName' app/build.gradle.kts | head -5
      - name: Verify check-webui contracts
        run: |
          if [ -f scripts/check-webui.js ]; then
            node scripts/check-webui.js || { echo "check-webui failed"; exit 1; }
          else
            echo "no check-webui.js — skip"
          fi
          grep -n 'toggleStream\|pngToJpeg\|wantJpeg\|fmt=jpeg' \
            app/src/main/java/com/cwbridge/android/server/WebUi.kt \
            app/src/main/java/com/cwbridge/android/server/LocalHttpServer.kt \
            app/src/main/java/com/cwbridge/android/bridge/BridgeControl.kt | head -30
      - name: Commit
        run: |
          git config user.name cwbridge-bot
          git config user.email bot@cwbridge.local
          git add app/src/main/java/com/cwbridge/android/bridge/BridgeControl.kt \
                  app/src/main/java/com/cwbridge/android/server/LocalHttpServer.kt \
                  app/src/main/java/com/cwbridge/android/server/WebUi.kt \
                  app/build.gradle.kts
          git status
          git commit -m "feat: live stream + tap/long-press on web panel image (v2.15.0)" || echo nochange
          git push
